# Déploiement Cleveria sur Render (render.com).
# Render = vrai serveur Node : les agents (agents/*.md, versionnés dans le repo)
# sont bundlés au build (`build:web` régénère agents.generated.ts, gitignoré).
# Pas de base de données.
services:
  - type: web
    name: cleveria-web
    runtime: node
    plan: free
    # Build depuis la racine du monorepo, puis build du workspace web.
    buildCommand: npm install && npm run build:web
    startCommand: npm run start --workspace=@cleveria/web
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Secrets : à renseigner dans le dashboard Render (sync:false = non versionné).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      # Modèles (surchargeables)
      - key: CLEVERIA_FACTORY_MODEL
        value: claude-opus-4-8
